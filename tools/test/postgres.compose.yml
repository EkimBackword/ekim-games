services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ekim_games_test
      POSTGRES_USER: eg_test
      POSTGRES_PASSWORD: eg_test_only
    ports:
      - '127.0.0.1:${TEST_DATABASE_PORT}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eg_test -d ekim_games_test']
      interval: 2s
      timeout: 3s
      retries: 30
