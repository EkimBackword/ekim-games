services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ekim_games
      POSTGRES_USER: ekim_games
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ekim_games -d ekim_games']
      interval: 5s
      timeout: 3s
      retries: 10

  db-roles:
    image: postgres:18-alpine
    restart: 'no'
    environment:
      PGHOST: postgres
      PGUSER: ekim_games
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: ekim_games
      CREATE_SHADOW_DATABASE: 'true'
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Set MIGRATION_DB_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    volumes:
      - ./tools/db/ensure-db-roles.sql:/ensure-db-roles.sql:ro
    entrypoint: ['/bin/sh', '-ec']
    command: ['psql -v ON_ERROR_STOP=1 -f /ensure-db-roles.sql']
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
